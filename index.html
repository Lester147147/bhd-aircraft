<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>BHD Aircraft Radar</title><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f4f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{padding:15px;background:#0b1727;border-bottom:1px solid #22344d}h1{font-size:21px;margin:0}.sub,.muted{color:#9db0c8}.bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#0e1b2d;border-bottom:1px solid #22344d}.count{font-size:28px;font-weight:800;color:#63d4ff}.grid{display:grid;gap:10px;padding:12px}.plane{background:#0e1b2d;border:1px solid #22344d;border-radius:14px;padding:13px}.top{display:flex;justify-content:space-between;gap:10px}.call{font-size:18px;font-weight:800}.track{font-size:22px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.fact{background:#091525;border-radius:9px;padding:8px;text-align:center}.fact b{display:block;font-size:14px}.fact span{font-size:11px;color:#9db0c8}.status{padding:18px;text-align:center;color:#9db0c8}.links{padding:12px;display:flex;gap:8px;flex-wrap:wrap}a{color:#f4f7fb;background:#0e1b2d;border:1px solid #22344d;border-radius:10px;padding:10px;text-decoration:none;font-weight:700}</style></head><body><header><h1>✈️ BHD Aircraft Radar</h1><div class="sub">Live aircraft within 50 NM of Belfast City Airport</div></header><div class="bar"><div><b>Aircraft nearby</b><div class="muted" id="updated">Connecting…</div></div><div class="count" id="count">…</div></div><div id="status" class="status">Loading live ADS-B / MLAT traffic…</div><main id="planes" class="grid"></main><div class="links"><a href="https://www.belfastcityairport.com/Flight-Info/Arrivals" target="_blank">BHD Arrivals</a><a href="https://www.belfastcityairport.com/Flight-Info/Departures" target="_blank">BHD Departures</a></div><script>const $=id=>document.getElementById(id);function arrow(t){if(t==null)return '✈';return `<span style="display:inline-block;transform:rotate(${t-45}deg)">✈</span>`}function climb(a){const v=a.baro_rate??a.geom_rate;if(v>150)return '▲';if(v< -150)return '▼';return '●'}async function load(){try{const r=await fetch('/api/aircraft?'+Date.now());const d=await r.json();if(!r.ok)throw new Error(d.error||'Feed error');const arr=(d.ac||[]).filter(a=>a.lat!=null&&a.lon!=null);$('count').textContent=arr.length;$('updated').textContent='Updated '+new Date().toLocaleTimeString();$('status').style.display=arr.length?'none':'block';$('status').textContent=arr.length?'':'No aircraft currently returned by feed';$('planes').innerHTML=arr.sort((a,b)=>(a.alt_baro||99999)-(b.alt_baro||99999)).map(a=>`<article class="plane"><div class="top"><div><div class="call">${(a.flight||a.r||a.hex||'Unknown').trim()}</div><div class="muted">${a.t||'Aircraft'} · ${a.r||a.hex||''}</div></div><div class="track">${arrow(a.track)} ${climb(a)}</div></div><div class="facts"><div class="fact"><b>${a.alt_baro==='ground'?'GROUND':(a.alt_baro!=null?Number(a.alt_baro).toLocaleString()+' ft':'—')}</b><span>Altitude</span></div><div class="fact"><b>${a.gs!=null?Math.round(a.gs)+' kt':'—'}</b><span>Speed</span></div><div class="fact"><b>${a.track!=null?Math.round(a.track)+'°':'—'}</b><span>Heading</span></div></div></article>`).join('')}catch(e){$('count').textContent='!';$('status').style.display='block';$('status').textContent='Live feed error: '+e.message;$('updated').textContent='Connection failed'}}load();setInterval(load,10000);</script></body></html>
