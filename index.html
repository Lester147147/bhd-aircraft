<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>BHD Aircraft Radar</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#f4f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{padding:12px 14px;background:#0b1727;border-bottom:1px solid #22344d}h1{font-size:20px;margin:0}.sub,.muted{color:#9db0c8}.bar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#0e1b2d;border-bottom:1px solid #22344d}.count{font-size:27px;font-weight:800;color:#63d4ff}#map{height:56vh;min-height:390px;background:#08111d}.leaflet-container{font-family:system-ui}.planeIcon{background:transparent;border:0}.planeGlyph{font-size:25px;line-height:25px;text-align:center;filter:drop-shadow(0 1px 2px #000)}.climb{color:#61e294}.descend{color:#ff7676;animation:pulse 1s infinite}.level{color:#63d4ff}@keyframes pulse{50%{opacity:.35}}.airport{font-size:24px}.grid{display:grid;gap:8px;padding:10px}.plane{background:#0e1b2d;border:1px solid #22344d;border-radius:12px;padding:11px}.top{display:flex;justify-content:space-between}.call{font-weight:800}.facts{display:flex;gap:12px;margin-top:6px;color:#9db0c8;font-size:13px}.links{padding:10px;display:flex;gap:8px}a{color:#f4f7fb;background:#0e1b2d;border:1px solid #22344d;border-radius:10px;padding:9px;text-decoration:none;font-weight:700}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0e1b2d;color:#f4f7fb}</style></head><body><header><h1>✈️ BHD Aircraft Radar</h1><div class="sub">Live aircraft within 50 NM of Belfast City Airport</div></header><div class="bar"><div><b>Aircraft nearby</b><div class="muted" id="updated">Connecting…</div></div><div class="count" id="count">…</div></div><div id="map"></div><div class="links"><a href="https://www.belfastcityairport.com/Flight-Info/Arrivals" target="_blank">BHD Arrivals</a><a href="https://www.belfastcityairport.com/Flight-Info/Departures" target="_blank">BHD Departures</a></div><main id="planes" class="grid"></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const BHD=[54.6181,-5.8725],$=id=>document.getElementById(id);const map=L.map('map',{zoomControl:true}).setView(BHD,8);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);L.circle(BHD,{radius:92600,color:'#63d4ff',weight:1,fill:false,dashArray:'5 7'}).addTo(map);L.marker(BHD,{icon:L.divIcon({className:'planeIcon',html:'<div class="airport">📍</div>',iconSize:[25,25],iconAnchor:[12,12]})}).addTo(map).bindPopup('<b>BHD / EGAC</b><br>Belfast City Airport');let marks=[];function state(a){const v=a.baro_rate??a.geom_rate??0;return v>150?'climb':v< -150?'descend':'level'}function glyph(a){const rot=(a.track??0)-45;return L.divIcon({className:'planeIcon',html:`<div class="planeGlyph ${state(a)}" style="transform:rotate(${rot}deg)">✈</div>`,iconSize:[28,28],iconAnchor:[14,14]})}function alt(a){return a.alt_baro==='ground'?'GROUND':a.alt_baro!=null?Number(a.alt_baro).toLocaleString()+' ft':'—'}async function load(){try{const r=await fetch('/api/aircraft?'+Date.now()),d=await r.json();if(!r.ok)throw Error(d.error);const arr=(d.ac||[]).filter(a=>a.lat!=null&&a.lon!=null);$('count').textContent=arr.length;$('updated').textContent=`${d.source||'Live feed'} · ${new Date().toLocaleTimeString()}`;marks.forEach(m=>map.removeLayer(m));marks=[];arr.forEach(a=>{const name=(a.flight||a.r||a.hex||'Unknown').trim();const m=L.marker([a.lat,a.lon],{icon:glyph(a)}).addTo(map).bindPopup(`<b>${name}</b><br>${a.t||'Aircraft'}<br>${alt(a)} · ${a.gs!=null?Math.round(a.gs)+' kt':'speed —'}<br>${state(a)==='climb'?'▲ Climbing':state(a)==='descend'?'▼ Descending':'● Level'}`);marks.push(m)});$('planes').innerHTML=arr.sort((a,b)=>(a.alt_baro||99999)-(b.alt_baro||99999)).slice(0,20).map(a=>`<div class="plane"><div class="top"><span class="call">${(a.flight||a.r||a.hex||'Unknown').trim()}</span><span class="${state(a)}">${state(a)==='climb'?'▲':state(a)==='descend'?'▼':'●'}</span></div><div class="facts"><span>${alt(a)}</span><span>${a.gs!=null?Math.round(a.gs)+' kt':'—'}</span><span>${a.track!=null?Math.round(a.track)+'°':'—'}</span></div></div>`).join('')}catch(e){$('updated').textContent='Feed error · retrying'}}load();setInterval(load,10000);</script></body></html>
